[directories]
log = "log/lsl-epoching"

[default_stream]
marker = "si_marker"
signal = "BrainAmpSeries"

[signal]
channels = ['Fp1', 'Fp2', 'AF7', 'AF3', 'AFz', 'AF4', 'AF8', 'F7', 'F5', 'F3', 'F1', 'Fz', 'F2', 'F4', 'F6', 'F8', 'FT9', 'FT7', 'FC5', 'FC3', 'FC1', 'FCz', 'FC2', 'FC4', 'FC6', 'FT8', 'FT10', 'T7', 'C5', 'C3', 'C1', 'Cz', 'C2', 'C4', 'C6', 'T8', 'TP9', 'TP7', 'CP5', 'CP3', 'CP1', 'CPz', 'CP2', 'CP4', 'CP6', 'TP8', 'TP10', 'P7', 'P5', 'P3', 'P1', 'Pz', 'P2', 'P4', 'P6', 'P8', 'PO7', 'PO3', 'POz', 'PO4', 'PO8', 'O1', 'Oz', 'O2']

# length of the buffer in seconds
length_buffer = 10

[markers]
# markers to epoch on: 8 = right-hand cue, 16 = left-hand cue
epochs = ['8', '16']

[lsl]
# pylsl post-processing flags
# proc_none = 0        no automatic post-processing
# proc_clocksync = 1   automatic clock synchronization
# proc_dejitter = 2    remove jitter from time stamps
# proc_monotonize = 4  force time stamps to be monotonically ascending
# proc_threadsafe = 8  post-processing is thread-safe
# proc_ALL = 15
processing_flags = 15

[pause]
main_loop = 0.01
